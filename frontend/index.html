<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Equipment Rental</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav>

        <h2>EquipRent</h2>

        <div>

            <span id="loggedUser">
                Guest
            </span>

            <a href="owner.html"
                id="ownerLink">
                Add Equipment
            </a>

            <a href="rental-tracking.html">
                Rental Tracking
            </a>


            <a href="login.html">
                Login
            </a>

            

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <main>

        <section class="hero">

            <h1>
                Rent Equipment From People Near You
            </h1>

            <p>
                Find cameras, tools, camping gear and more.
            </p>

        </section>


        <section class="filters">

            <input
                type="text"
                id="search"
                placeholder="Search equipment..."
                oninput="loadEquipment()"
            >

            <select
                id="category"
                onchange="loadEquipment()">

                <option value="">
                    All Categories
                </option>

                <option value="Cameras">
                    Cameras
                </option>

                <option value="Tools">
                    Tools
                </option>

                <option value="Camping Gear">
                    Camping Gear
                </option>

                <option value="Party Supplies">
                    Party Supplies
                </option>

            </select>

            <input
                type="text"
                id="owner"
                placeholder="Search by owner..."
                oninput="loadEquipment()"
            >

        </section>


        <section>

            <h2>Available Equipment</h2>

            <div
                id="equipmentContainer"
                class="equipment-grid">

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
